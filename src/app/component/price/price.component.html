<div class="price-grid offset">
  <p-card *ngFor="let price of prices" class="offer-card">
    <ng-template pTemplate="header">
      <div class="card-title">
        <div class="card-icon">
          <i [class]="price.icon"></i>
        </div>
        {{ price.titleKey | translate }}
      </div>
    </ng-template>
    <ng-template pTemplate="body">
      <ul>
        <li *ngFor="let descKey of price.descriptionKeys">
          {{ descKey | translate }}
        </li>
      </ul>
    </ng-template>
    <ng-template pTemplate="footer">
      <div class="card-price pb-0">
        {{ price.price | currency: "EUR" : "symbol" : "2.0-1" }}
      </div>
      <div class="card-price pt-0">{{ "price.per_hour" | translate }}</div>
    </ng-template>
  </p-card>
</div>
